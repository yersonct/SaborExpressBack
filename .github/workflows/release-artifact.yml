name: Build immutable release artifact

on:
  push:
    branches:
      - release/HU-STG-02-smoke-migraciones
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v7

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create artifact manifest
        shell: bash
        run: |
          mkdir -p release-artifact
          cat > release-artifact/manifest.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "image": "${IMAGE}@${{ steps.image.outputs.digest }}",
            "digest": "${{ steps.image.outputs.digest }}",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.sha }}
          path: release-artifact/manifest.json
          if-no-files-found: error
          retention-days: 90
