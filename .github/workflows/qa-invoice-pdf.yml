name: QA invoice PDF

on:
  workflow_dispatch:
  push:
    branches:
      - feature/HU-QA-02-factura-pdf
  pull_request:
    branches:
      - qa

permissions:
  contents: read

jobs:
  invoice-pdf-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test invoice PDF
        run: >-
          dotnet test tests/SaborExpressBack.InvoicePdf.Tests/SaborExpressBack.InvoicePdf.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=HU-QA-02-invoice-pdf.trx"
          --results-directory TestResults

      - name: Preserve test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HU-QA-02-invoice-pdf-${{ github.run_number }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30
