name: Staging release smoke

on:
  # Bootstrap before this workflow exists on main. This metadata push never
  # builds an OCI artifact and does not require a fabricated deployment ID.
  push:
    branches: [staging]
    paths: [docs/release/production-release-candidate.json]
  workflow_dispatch:
    inputs:
      tested_commit:
        description: Full Git SHA currently deployed in the Render staging service
        required: true
        type: string
      deploy_id:
        description: Render staging deployment ID (dep-...)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: staging-release-smoke
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/release/HU-MAIN-01-promocion-produccion'
    runs-on: windows-latest
    environment: staging
    steps:
      - name: Check out the selected staging workflow and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve the live candidate for a metadata push or manual run
        id: candidate
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_COMMIT: ${{ inputs.tested_commit }}
          RENDER_DEPLOY_ID: ${{ inputs.deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            $candidate = Get-Content docs/release/production-release-candidate.json -Raw | ConvertFrom-Json
            if ($candidate.schemaVersion -ne 2 -or $candidate.deploymentProvider -cne 'render-git' -or
                $candidate.state -cne 'ready-for-smoke' -or $candidate.sourceCommit -notmatch '^[0-9a-fA-F]{40}$') {
              throw 'Prepare a schema 2 Render Git candidate with state ready-for-smoke and a real sourceCommit.'
            }
            . ./scripts/release/render-deployment.ps1
            $live = Get-CurrentRenderGitDeployment -ServiceId $env:RENDER_STAGING_SERVICE_ID -ExpectedBranch staging
            $head = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the workflow commit.' }
            Assert-RenderMetadataOnlyChanges -RepositoryPath . -FromCommit $candidate.sourceCommit -ToCommit $head
            Assert-RenderMetadataOnlyChanges -RepositoryPath . -FromCommit $candidate.sourceCommit -ToCommit $live.Commit
            $env:TESTED_COMMIT = $live.Commit
            $env:RENDER_DEPLOY_ID = $live.DeployId
          }
          if ($env:TESTED_COMMIT -notmatch '^[0-9a-fA-F]{40}$' -or $env:RENDER_DEPLOY_ID -cnotmatch '^dep-[0-9a-z]{20}$') {
            throw 'Provide the full tested commit and Render deployment ID.'
          }
          "tested_commit=$env:TESTED_COMMIT" >> $env:GITHUB_OUTPUT
          "deploy_id=$env:RENDER_DEPLOY_ID" >> $env:GITHUB_OUTPUT

      - name: Verify Render before and after read-only staging smoke checks
        shell: pwsh
        env:
          TESTED_COMMIT: ${{ steps.candidate.outputs.tested_commit }}
          RENDER_DEPLOY_ID: ${{ steps.candidate.outputs.deploy_id }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
          RELEASE_SMOKE_API_URL: ${{ secrets.RELEASE_SMOKE_API_URL }}
          RELEASE_SMOKE_IDENTIFIER: ${{ secrets.RELEASE_SMOKE_IDENTIFIER }}
          RELEASE_SMOKE_PASSWORD: ${{ secrets.RELEASE_SMOKE_PASSWORD }}
          RELEASE_SMOKE_BRANCH_ID: ${{ vars.RELEASE_SMOKE_BRANCH_ID }}
          RELEASE_SMOKE_ORDER_ID: ${{ vars.RELEASE_SMOKE_ORDER_ID }}
          RELEASE_SMOKE_PAID_ORDER_ID: ${{ vars.RELEASE_SMOKE_PAID_ORDER_ID }}
          RELEASE_SMOKE_DELIVERY_ORDER_ID: ${{ vars.RELEASE_SMOKE_DELIVERY_ORDER_ID }}
          RELEASE_SMOKE_INVOICE_ID: ${{ vars.RELEASE_SMOKE_INVOICE_ID }}
        run: ./scripts/release/smoke-render-staging.ps1 -TestedCommit $env:TESTED_COMMIT -DeployId $env:RENDER_DEPLOY_ID

      - name: Preserve the tested Render deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: staging-render-verification
          path: release-results/render-staging-verification.json
          if-no-files-found: error
          retention-days: 90
