name: Staging release smoke

on:
  workflow_dispatch:
  push:
    branches: [staging, release/HU-MAIN-01-promocion-produccion]
    paths: [docs/release/production-release-evidence.json]

permissions:
  contents: read

jobs:
  smoke:
    name: staging-release-smoke
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/release/HU-MAIN-01-promocion-produccion'
    runs-on: windows-latest
    environment: staging
    steps:
      - name: Check out release evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read candidate and digest from release evidence
        id: evidence
        shell: pwsh
        run: |
          $evidence = Get-Content docs/release/production-release-evidence.json -Raw | ConvertFrom-Json
          if ($evidence.sourceCommit -notmatch '^[0-9a-fA-F]{40}$') { throw 'sourceCommit must be a full SHA.' }
          if ($evidence.artifact.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'artifact.digest must be an OCI sha256 digest.' }
          "source_sha=$($evidence.sourceCommit)" >> $env:GITHUB_OUTPUT
          "digest=$($evidence.artifact.digest)" >> $env:GITHUB_OUTPUT

      - name: Check out candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.evidence.outputs.source_sha }}
          fetch-depth: 0

      - name: Confirm staging deployment digest
        shell: pwsh
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.digest }}
          STAGING_DEPLOYED_IMAGE_DIGEST: ${{ vars.STAGING_DEPLOYED_IMAGE_DIGEST }}
        run: |
          if ($env:EXPECTED_ARTIFACT_DIGEST -notmatch '^sha256:[0-9a-f]{64}$') {
            throw 'artifact_digest must be a sha256 OCI digest.'
          }
          if ([string]::IsNullOrWhiteSpace($env:STAGING_DEPLOYED_IMAGE_DIGEST) -or
              $env:STAGING_DEPLOYED_IMAGE_DIGEST -cne $env:EXPECTED_ARTIFACT_DIGEST) {
            throw 'The digest configured for the staging deployment does not match the candidate artifact.'
          }

      - name: Run read-only staging smoke checks
        shell: pwsh
        env:
          RELEASE_SMOKE_API_URL: ${{ secrets.RELEASE_SMOKE_API_URL }}
          RELEASE_SMOKE_IDENTIFIER: ${{ secrets.RELEASE_SMOKE_IDENTIFIER }}
          RELEASE_SMOKE_PASSWORD: ${{ secrets.RELEASE_SMOKE_PASSWORD }}
          RELEASE_SMOKE_BRANCH_ID: ${{ vars.RELEASE_SMOKE_BRANCH_ID }}
          RELEASE_SMOKE_ORDER_ID: ${{ vars.RELEASE_SMOKE_ORDER_ID }}
          RELEASE_SMOKE_PAID_ORDER_ID: ${{ vars.RELEASE_SMOKE_PAID_ORDER_ID }}
          RELEASE_SMOKE_DELIVERY_ORDER_ID: ${{ vars.RELEASE_SMOKE_DELIVERY_ORDER_ID }}
          RELEASE_SMOKE_INVOICE_ID: ${{ vars.RELEASE_SMOKE_INVOICE_ID }}
        run: ./scripts/release/smoke-staging.ps1
