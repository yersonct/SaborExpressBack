name: QA operational regression

on:
  workflow_dispatch:
  push:
    branches:
      - test/HU-QA-01-flujos-operativos
  pull_request:
    branches:
      - qa

permissions:
  contents: read

jobs:
  backend-operational-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and run automated operational tests
        run: >-
          dotnet test tests/SaborExpressBack.QA.Tests/SaborExpressBack.QA.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=HU-QA-01.trx"
          --results-directory TestResults

      - name: Preserve test execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HU-QA-01-${{ github.run_number }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30
