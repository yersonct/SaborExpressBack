name: Build production candidate artifact

on:
  push:
    branches: [release/HU-MAIN-01-promocion-produccion]
    paths: [docs/release/production-release-candidate.json]

permissions:
  contents: read
  checks: read
  packages: write

jobs:
  build:
    name: build-release-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm candidate is in QA and staging
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(jq -r '.sourceCommit' docs/release/production-release-candidate.json)"
          STATE="$(jq -r '.state' docs/release/production-release-candidate.json)"
          if [[ "$STATE" != "approved" ]]; then
            echo "Candidate is pending approval; artifact creation is blocked."
            exit 1
          fi
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character commit SHA."
            exit 1
          fi
          git fetch origin refs/heads/qa:refs/remotes/origin/qa refs/heads/staging:refs/remotes/origin/staging
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/staging || {
            echo "Candidate is not part of staging."
            exit 1
          }
          git diff --quiet "$CANDIDATE_SHA" origin/qa || {
            echo "The candidate source tree differs from the code that reached QA."
            exit 1
          }

          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CANDIDATE_SHA}/check-runs")"
          for required in "security-gate" "GitGuardian Security Checks"; do
            if ! jq -e --arg name "$required" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.started_at // "")
              | last
              | (.status == "completed" and .conclusion == "success")
            ' <<< "$checks" >/dev/null; then
              echo "Required candidate check is missing or not successful: $required"
              exit 1
            fi
          done
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          fetch-depth: 0

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image from candidate
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./candidate
          file: ./candidate/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.candidate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.candidate.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create artifact manifest
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          mkdir -p release-artifact
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$CANDIDATE_SHA" \
            --arg image "${IMAGE}@${IMAGE_DIGEST}" \
            --arg digest "$IMAGE_DIGEST" \
            --arg workflow_run "$WORKFLOW_RUN" \
            '{repository:$repository,commit:$commit,image:$image,digest:$digest,workflow_run:$workflow_run}' \
            > release-artifact/manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ steps.candidate.outputs.sha }}
          path: release-artifact/manifest.json
          if-no-files-found: error
          retention-days: 90
